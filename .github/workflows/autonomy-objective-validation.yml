name: Triage Autonomy Objective Validation

on:
  push:
    paths:
      - 'autonomy/objective-contract.json'
      - 'triage/**'
      - 'tests/**'
      - 'scripts/project_autonomy_completion_evidence.py'
      - '.github/workflows/autonomy-objective-validation.yml'
  pull_request:
    paths:
      - 'autonomy/objective-contract.json'
      - 'triage/**'
      - 'tests/**'
      - 'scripts/project_autonomy_completion_evidence.py'
      - '.github/workflows/autonomy-objective-validation.yml'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: triage-autonomy-objective-validation
  cancel-in-progress: false

jobs:
  validate-and-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run Triage implementation tests
        run: python -m pytest tests -q
      - name: Project strict completion evidence
        env:
          TRIAGE_TESTS_PASSED: 'true'
        run: python scripts/project_autonomy_completion_evidence.py
      - name: Validate fail-closed projection
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          evidence = json.loads(Path('data/autonomy/completion-evidence.json').read_text())
          assert evidence['repository'] == 'GCAT-BCAT-Engine/Triage'
          assert evidence['projection_state'] == 'IMPLEMENTATION_INSTALLED_ACTIVATION_UNVERIFIED'
          assert evidence['runtime_observed'] is False
          assert evidence['user_visible_outcome_verified'] is False
          assert evidence['critical_blockers'] > 0
          assert evidence['authority']['unit_tests_are_operational_completion'] is False
          assert evidence['authority']['projection_is_medical_authority'] is False
          print('Triage fail-closed autonomy projection valid')
          PY
      - name: Persist destination-owned evidence
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/autonomy/completion-evidence.json
          if git diff --cached --quiet; then
            echo 'Triage completion projection unchanged.'
          else
            git commit -m 'chore: persist Triage autonomy evidence [skip ci]'
            git pull --rebase
            git push
          fi
